[workspace]
resolver = "2"
members = [ "kvq", "qed_dsol_bridge_core", "qed_dsol_ibc_node_common" ]


[workspace.dependencies]
colored = "2"
serde = { version = "1.0.193", features = ["derive"] }
serde_json = "1.0"
serde_with = { version = "3.4.0", features = ["hex"] }
serde_repr = "0.1.19"
hex = "0.4.3"
hex-literal = "0.4.1"
lazy_static = "1.4.0"
once_cell = "1.19.0"
twox-hash = "1.6.3"
hashbrown = "0.14.5"
anyhow = "1.0.75"
async-trait = { version = "0.1.80" }
base64 = "0.21.0"
bitcoin = { git = "https://github.com/QEDProtocol/rust-dogecoin", rev = "9b52ed2ddc18c2062c741b7df7a6e70aabde3bb8", features = [ "serde" ] }
chrono = "0.4.39"
doge-light-client = { path = "../dlc-lib/doge-light-client", default-features = false, features = ["sha2", "borsh"] }
qed-doge-data-link = { path = "../dlc-lib/qed-doge-data-link" }

rand = "0.8"
rand_core = "0.6.0"
rand_pcg = "0.9.0"
rayon = { version = "1.10.0" }
bincode = "=1.3.3"

tracing = "0.1.40"
tracing-log = "0.2.0"
tracing-subscriber = { version = "0.3.17", features = ["std", "env-filter"] }
itertools = "0.10.5"
borsh = "^0.10"
num-derive = "^0.3"
num-traits = "^0.2"
thiserror = "^1.0"

qed-data-loader-v3-program-client = { git = "https://github.com/cf/data-loader-v3.git", tag = "0.1.1" }

zerocopy = { git = "https://github.com/cf/zerocopy-borsh-serde", branch = "borsh-serde-v0.8.23", default-features = false, features = ["borsh", "std", "serde"] }
zerocopy-derive = { git = "https://github.com/cf/zerocopy-borsh-serde", branch = "borsh-serde-v0.8.23", default-features = false, features = ["borsh", "std", "serde"]  }

solana-sdk = "~2.1"
solana-client = { version = "~2.1", default-features = false }



bytes = "1"

clap = { version = "4.4.6", features = ["derive", "env"] }
k256 = { version = "0.13.2", features = [
  "arithmetic",
  "ecdsa",
  "pkcs8",
  "precomputed-tables",
  "schnorr",
  "signature",
  "std",
  "serde",
] }

sha2 = "0.10.8"
sha3 = "0.10.8"


num = { version = "0.4.0", default-features = false }
unroll = "0.1.5"
postcard = { version = "1.0.0", default-features = false, features = ["alloc"] }

bitflags = "2.5.0"

ripemd = "0.1.3"
log = { version = "0.4.14", default-features = false }
env_logger = { version = "0.9.0", default-features = false }


tokio = { version = "1.43.0", features = ["full"] }
tokio-executor-trait = "2.1.3"
tokio-reactor-trait = "1.1.0"

futures = "0.3.0"
redis = { version = "^0.25", default-features = false, features = ["acl", "keep-alive", "script"] }
fred = "10.0.4"

reqwest = { version = "0.12", features = ["json"] }

